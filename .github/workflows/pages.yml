name: Deploy Riskéo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Riskéo
        run: npm run build

      - name: Prepare GitHub Pages paths
        run: |
          node --input-type=module <<'NODE'
          import { copyFileSync, readdirSync, readFileSync, statSync, writeFileSync } from 'node:fs';
          import { extname, join } from 'node:path';

          const root = 'dist/client';
          const textExtensions = new Set(['.css', '.html', '.js', '.json', '.rsc']);

          function walk(directory) {
            for (const entry of readdirSync(directory)) {
              const filePath = join(directory, entry);
              const stat = statSync(filePath);

              if (stat.isDirectory()) {
                walk(filePath);
                continue;
              }

              if (!textExtensions.has(extname(filePath))) {
                continue;
              }

              const updated = readFileSync(filePath, 'utf8')
                .replaceAll('/_next/', '/riskeo/_next/')
                .replaceAll('/brand/', '/riskeo/brand/')
                .replaceAll('/favicon.', '/riskeo/favicon.');

              writeFileSync(filePath, updated);
            }
          }

          walk(root);
          copyFileSync(join(root, 'index.html'), join(root, '404.html'));
          writeFileSync(join(root, '.nojekyll'), '');
          NODE

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
